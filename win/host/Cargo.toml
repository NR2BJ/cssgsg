[package]
name = "cssgsg-host"
description = "cssgsg 윈도우 엔진 호스트: 사용자당 하나 뜨는 일본어 변환(Mozc) 프로세스"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# 윈도우 전용이다. 다른 OS에서는 빈 main으로 빌드된다(맥의 cargo test·clippy --workspace를 깨지 않는다).
# 코어는 Mozc 변환기만(mozc-engine) 켠다. 그래도 입력기 DLL과는 따로 빌드한다(cargo build -p cssgsg-host): 기능은 같이
# 빌드하는 패키지끼리 합쳐져서, 같이 빌드하면 입력기 DLL에도 Mozc 변환기 코드가 들어간다.
[[bin]]
name = "cssgsg-host"
path = "src/main.rs"

[dependencies]
cssgsg-core = { path = "../../core", default-features = false, features = ["mozc-engine"] }

[target.'cfg(windows)'.dependencies]
cssgsg-ipc = { path = "../ipc" }
serde_json = "1"
windows-registry = "0.6"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
