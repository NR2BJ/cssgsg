# cssgsg 맥 입력기. xcodegen으로 cssgsg.xcodeproj를 만든다(생성물은 커밋하지 않는다).
# pkg: bash tools/mac/build-pkg.sh, 릴리스: bash tools/mac/release.sh <버전> (README "릴리스 만들기")
name: cssgsg
options:
  bundleIdPrefix: com.cssgsg.inputmethod
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  developmentLanguage: ko

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    MARKETING_VERSION: "0.7.5-beta.1"
    CURRENT_PROJECT_VERSION: "31"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  cssgsg:
    type: application
    platform: macOS
    sources:
      - path: cssgsg
        excludes:
          - Resources/Info.plist
      # 입력기와 설정 앱이 같이 쓰는 이름·경로·알림
      - path: Shared
      - path: ../learn/index.html
        buildPhase: resources
        type: file
      # 다른 소프트웨어·데이터 고지문(tools/make-notices.sh)
      - path: ../THIRD_PARTY_NOTICES.txt
        buildPhase: resources
        type: file
      # Mozc 엔진(실행 중에 읽는다)과 같이 빌드한 사전 데이터, 그 판("<커밋> <커밋 날짜> <버전>").
      # tools/mozc/build.sh가 만든다(build-core.sh가 없으면 먼저 부른다). 입력기가 받은 더 새 엔진이 있으면 그것을 쓴다.
      # optional: 막 받은 저장소에는 아직 없다(프로젝트를 만든 뒤 빌드 전에 생긴다).
      - path: ../build/mozc-out/lib/libcssgsg_mozc.dylib
        buildPhase:
          copyFiles:
            destination: frameworks
        type: file
        optional: true
      - path: ../build/mozc-out/data/mozc.data
        buildPhase: resources
        type: file
        optional: true
      - path: ../build/mozc-out/MOZC_VERSION
        buildPhase: resources
        type: file
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cssgsg.inputmethod.app
        PRODUCT_NAME: cssgsg
        INFOPLIST_FILE: cssgsg/Resources/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: cssgsg/cssgsg-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/../core/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/../build/cargo/release
        # 코어. Mozc는 링크하지 않는다(엔진 dylib를 실행 중에 읽는다).
        # 정적 라이브러리를 경로로 준다: -l이면 같은 폴더에 .dylib가 있을 때 링커가 그것을 고르고, 앱은 빌드 폴더를 가리켜
        # 빌드한 맥에서만 뜬다(0.7.2 설정 앱, config-ffi에 윈도우용 cdylib가 생긴 뒤).
        OTHER_LDFLAGS: $(SRCROOT)/../build/cargo/release/libcssgsg_core.a
        COMBINE_HIDPI_IMAGES: true
        # 입력기는 서명 없이(ad-hoc) 쓴다
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_ALLOWED: false
    preBuildScripts:
      - script: bash "$SRCROOT/../tools/mac/build-core.sh"
        name: Build Rust core
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - script: chmod +x "${BUILT_PRODUCTS_DIR}/${EXECUTABLE_PATH}"
        name: Fix executable permissions
        basedOnDependencyAnalysis: false
    dependencies:
      - sdk: InputMethodKit.framework
      - sdk: Carbon.framework
      - sdk: IOKit.framework
      - sdk: Security.framework

  # 설정 앱. 입력기 옆(/Library/Input Methods/cssgsgSettings.app)에 같이 설치한다(tools/mac/build-pkg.sh).
  # 러스트는 설정 라이브러리(config-ffi)만 링크한다. 입력기 코어(Mozc 포함)는 들어가지 않는다.
  cssgsgSettings:
    type: application
    platform: macOS
    sources:
      - path: Settings
        excludes:
          - Info.plist
      - path: Shared
      - path: ../learn/index.html
        buildPhase: resources
        type: file
      # 타자 연습 페이지(tools/practice/build.mjs). 배열 학습 페이지와 이름이 같아(index.html) practice/ 아래에 둔다.
      - path: ../practice/index.html
        buildPhase:
          copyFiles:
            destination: resources
            subpath: practice
        type: file
      - path: ../THIRD_PARTY_NOTICES.txt
        buildPhase: resources
        type: file
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cssgsg.settings
        PRODUCT_NAME: cssgsgSettings
        INFOPLIST_FILE: Settings/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: Settings/Settings-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/../config-ffi/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/../build/cargo/release
        # 정적 라이브러리를 경로로(위 입력기와 같은 까닭). config-ffi는 윈도우 설정 앱용 cdylib도 만들어 같은 폴더에
        # libcssgsg_config.dylib가 있다. 0.7.2는 -lcssgsg_config로 그것에 링크되어 다른 맥에서 뜨자마자 죽었다.
        OTHER_LDFLAGS: $(SRCROOT)/../build/cargo/release/libcssgsg_config.a
        # 러스트 정적 라이브러리에서 설정 변환에 쓰지 않는 코드(엔진, 한자 사전 6MB)를 버린다.
        DEAD_CODE_STRIPPING: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_ALLOWED: false
    preBuildScripts:
      - script: bash "$SRCROOT/../tools/mac/build-config-lib.sh"
        name: Build Rust config library
        basedOnDependencyAnalysis: false
    dependencies:
      - sdk: WebKit.framework
