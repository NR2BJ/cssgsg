[package]
name = "cssgsg-config"
description = "cssgsg 설정 앱용 C ABI: 설정 파일(TOML) ↔ JSON"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "cssgsg_config"
# staticlib: 맥 설정 앱이 링크한다. cdylib: 윈도우 설정 앱(C#)이 cssgsg_config.dll로 부른다.
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
# 입력기 C ABI(ffi)와 Mozc 없이 쓴다: 설정 앱에 엔진·한자 사전·Mozc가 딸려 들어가지 않는다.
cssgsg-core = { path = "../core", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
