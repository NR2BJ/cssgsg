# 참신세벌식 v18 (기본형, 메인)
#
# 출처
# - 원작자(공빈) 확정안: https://cafe.daum.net/3bulsik/JMKX/147 (2026-02-12 수정)
# - 날개셋 파일 참신세벌식_v18.ist 속 사용법 (받침 ㅋ = ㄱ+ㅁ 권장, 2026-02 패치 반영본)
# - 키 배치: 타닥 문서 배열도, 오이(Online Hangeul IME)와 같다
#
# 키 이름은 쿼티 물리 자리의 소문자 글자다. [base]는 Shift 없이, [shift]는 Shift와 함께 누른다.
# 역할: cho(초성) jung(중성) jong(종성) sym(기호) action("stop" = 음절 조합 중지 ❖)
# 여기 없는 키는 쿼티 그대로 나간다(숫자, - = [ ] \ ' ` , 와 그 Shift 기호).

[meta]
id = "chamshin-v18"
name = "참신세벌식"
variant = "v18"

[base]
# 윗줄
q = { jung = "ㅠ", jong = "ㅆ" }
w = { jung = "ㅢ", jong = "ㄹ" }
e = { jung = "ㅔ", jong = "ㄱ" }
r = { jung = "ㅜ", jong = "ㅌ" }
t = { jung = "ㅕ", jong = "ㅊ" }
y = { cho = "ㅊ" }
u = { cho = "ㅁ" }
i = { cho = "ㄷ" }
o = { cho = "ㄹ", jung = "ㅗ" }   # 초성 바로 뒤에서는 오른손 ㅗ (겹모음 시작)
p = { cho = "ㅌ" }
# 가운뎃줄
a = { jung = "ㅛ", jong = "ㅁ" }
s = { jung = "ㅐ", jong = "ㄴ" }
d = { jung = "ㅣ", jong = "ㅇ" }
f = { jung = "ㅏ", jong = "ㄷ" }
g = { jung = "ㅗ", jong = "ㅍ" }
h = { cho = "ㅎ" }
j = { cho = "ㅇ" }
k = { cho = "ㄱ" }
l = { cho = "ㅅ" }
";" = { cho = "ㅂ" }
# 아랫줄
z = { jung = "ㅖ", jong = "ㅂ" }
x = { jung = "ㅒ", jong = "ㅅ" }
c = { jung = "ㅡ", jong = "ㅎ" }
v = { jung = "ㅓ", jong = "ㅈ" }
b = { cho = "ㅋ", jung = "ㅑ" }   # 초성 바로 뒤에서는 ㅑ
n = { cho = "ㅈ" }
m = { cho = "ㄴ" }
"." = { sym = ".", jung = "ㅜ" }  # 초성 바로 뒤에서는 오른손 ㅜ (겹모음 시작)
"/" = { cho = "ㅍ" }

[shift]
q = { sym = "「" }
w = { sym = "」" }
e = { sym = "『" }
r = { sym = "』" }
t = { sym = "□" }
y = { sym = "※" }
u = { sym = "←" }
i = { sym = "→" }
o = { sym = "―" }                 # 오이는 — (U+2014)
p = { sym = ";" }
a = { sym = "‘" }
s = { sym = "’" }
d = { sym = "“" }
f = { sym = "”" }
g = { sym = "○" }
h = { sym = "×" }                 # 오이는 ⨉ (U+2A09)
j = { sym = "·" }
k = { sym = "…" }
l = { sym = "/" }
z = { sym = "〈" }
x = { sym = "〉" }
c = { sym = "《" }
v = { sym = "》" }
b = { sym = "△", jong = "ㅋ" }   # 초성+중성 뒤(받침 없음)에서는 받침 ㅋ (비권장, ㄱ+ㅁ 권장)
n = { action = "stop" }           # ❖ 음절 조합 중지 (ㅋㅋ = ㅋ ❖ ㅋ)
m = { sym = "ㆍ" }                # 아래아. 옛한글 조합은 아직 지원하지 않는다

[combine]
# "앞+뒤=결과". 원작자 권장 조합 + 표준 조합 + 오이의 역순 편의 조합.
cho = [
  "ㄱㄱ=ㄲ", "ㄷㄷ=ㄸ", "ㅂㅂ=ㅃ", "ㅅㅅ=ㅆ", "ㅈㅈ=ㅉ",   # 같은 키 연타
  "ㅇㄱ=ㄲ", "ㅇㄷ=ㄸ", "ㅇㅂ=ㅃ", "ㅇㅅ=ㅆ", "ㅈㅇ=ㅉ",   # 권장
]
jung = [
  "ㅗㅏ=ㅘ", "ㅗㅐ=ㅙ", "ㅗㅣ=ㅚ", "ㅜㅓ=ㅝ", "ㅜㅔ=ㅞ", "ㅜㅣ=ㅟ", "ㅡㅣ=ㅢ",
  "ㅣㅏ=ㅑ",                                                # 초성 없는 ㅑ
]
jong = [
  # 표준
  "ㄱㄱ=ㄲ", "ㄱㅅ=ㄳ", "ㄴㅈ=ㄵ", "ㄴㅎ=ㄶ", "ㄹㄱ=ㄺ", "ㄹㅁ=ㄻ", "ㄹㅂ=ㄼ",
  "ㄹㅅ=ㄽ", "ㄹㅌ=ㄾ", "ㄹㅍ=ㄿ", "ㄹㅎ=ㅀ", "ㅂㅅ=ㅄ", "ㅅㅅ=ㅆ",
  # 원작자 권장 (v18 .ist)
  "ㄱㅁ=ㅋ", "ㄱㅆ=ㄳ", "ㄱㄴ=ㄵ", "ㅇㄴ=ㄶ", "ㄴㅁ=ㄼ", "ㄹㅆ=ㄽ", "ㅇㅁ=ㄿ", "ㅇㄹ=ㅀ",
  "ㅅㅂ=ㅄ", "ㄱㄹ=ㄺ",
  # 역순 편의 (오이)
  "ㅅㄱ=ㄳ", "ㅈㄴ=ㄵ", "ㄴㅇ=ㄶ", "ㅎㄴ=ㄶ", "ㅁㄹ=ㄻ", "ㅁㄴ=ㄼ", "ㅂㄹ=ㄼ",
  "ㅆㄹ=ㄽ", "ㅌㄹ=ㄾ", "ㅍㄹ=ㄿ", "ㄹㅇ=ㅀ", "ㅎㄹ=ㅀ",
]
