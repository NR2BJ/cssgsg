# 참신세벌식D v19 (변형, 설정에서 고른다)
#
# 출처
# - 원작자(공빈) 확정안: https://cafe.daum.net/3bulsik/JMKX/147
# - 날개셋 파일 참신세벌식D_v19.ist 속 사용법
# - 숫자열 받침 자리(2=ㅈ, 3=ㄷ, 4=ㅍ)는 타닥 배열도, 그리고 v18/D .ist 바이트코드 비교로 확인
#
# 기본형(v18)과 다른 점
# - 받침 ㅈ·ㄷ·ㅍ이 숫자열 2·3·4로 간다. 초성+중성 뒤(받침 없음)에서만 받침이고 그 밖에는 숫자다.
#   받침 없는 음절 바로 뒤에 숫자 2·3·4를 치려면 ❖(Shift+N)를 먼저 친다. 예) 표3 = 표 ❖ 3
# - 받침 ㅋ이 f 갈마들이로 간다. g, v는 모음만 남는다. Shift+B는 △만 낸다.
# - ㄿ은 역순(ㅍ→ㄹ) 입력을 권장한다. ㄱ+ㅁ→ㅋ, ㅇ+ㅁ→ㄿ 조합은 없다.

[meta]
id = "chamshin-d-v19"
name = "참신세벌식D"
variant = "v19"

[base]
"2" = { sym = "2", jong = "ㅈ" }
"3" = { sym = "3", jong = "ㄷ" }
"4" = { sym = "4", jong = "ㅍ" }
# 윗줄
q = { jung = "ㅠ", jong = "ㅆ" }
w = { jung = "ㅢ", jong = "ㄹ" }
e = { jung = "ㅔ", jong = "ㄱ" }
r = { jung = "ㅜ", jong = "ㅌ" }
t = { jung = "ㅕ", jong = "ㅊ" }
y = { cho = "ㅊ" }
u = { cho = "ㅁ" }
i = { cho = "ㄷ" }
o = { cho = "ㄹ", jung = "ㅗ" }
p = { cho = "ㅌ" }
# 가운뎃줄
a = { jung = "ㅛ", jong = "ㅁ" }
s = { jung = "ㅐ", jong = "ㄴ" }
d = { jung = "ㅣ", jong = "ㅇ" }
f = { jung = "ㅏ", jong = "ㅋ" }
g = { jung = "ㅗ" }
h = { cho = "ㅎ" }
j = { cho = "ㅇ" }
k = { cho = "ㄱ" }
l = { cho = "ㅅ" }
";" = { cho = "ㅂ" }
# 아랫줄
z = { jung = "ㅖ", jong = "ㅂ" }
x = { jung = "ㅒ", jong = "ㅅ" }
c = { jung = "ㅡ", jong = "ㅎ" }
v = { jung = "ㅓ" }
b = { cho = "ㅋ", jung = "ㅑ" }
n = { cho = "ㅈ" }
m = { cho = "ㄴ" }
"." = { sym = ".", jung = "ㅜ" }
"/" = { cho = "ㅍ" }

[shift]
q = { sym = "「" }
w = { sym = "」" }
e = { sym = "『" }
r = { sym = "』" }
t = { sym = "□" }
y = { sym = "※" }
u = { sym = "←" }
i = { sym = "→" }
o = { sym = "―" }
p = { sym = ";" }
a = { sym = "‘" }
s = { sym = "’" }
d = { sym = "“" }
f = { sym = "”" }
g = { sym = "○" }
h = { sym = "×" }
j = { sym = "·" }
k = { sym = "…" }
l = { sym = "/" }
z = { sym = "〈" }
x = { sym = "〉" }
c = { sym = "《" }
v = { sym = "》" }
b = { sym = "△" }
n = { action = "stop" }
m = { sym = "ㆍ" }

[combine]
cho = [
  "ㄱㄱ=ㄲ", "ㄷㄷ=ㄸ", "ㅂㅂ=ㅃ", "ㅅㅅ=ㅆ", "ㅈㅈ=ㅉ",
  "ㅇㄱ=ㄲ", "ㅇㄷ=ㄸ", "ㅇㅂ=ㅃ", "ㅇㅅ=ㅆ", "ㅈㅇ=ㅉ",
]
jung = [
  "ㅗㅏ=ㅘ", "ㅗㅐ=ㅙ", "ㅗㅣ=ㅚ", "ㅜㅓ=ㅝ", "ㅜㅔ=ㅞ", "ㅜㅣ=ㅟ", "ㅡㅣ=ㅢ",
  "ㅣㅏ=ㅑ",
]
jong = [
  # 표준
  "ㄱㄱ=ㄲ", "ㄱㅅ=ㄳ", "ㄴㅈ=ㄵ", "ㄴㅎ=ㄶ", "ㄹㄱ=ㄺ", "ㄹㅁ=ㄻ", "ㄹㅂ=ㄼ",
  "ㄹㅅ=ㄽ", "ㄹㅌ=ㄾ", "ㄹㅍ=ㄿ", "ㄹㅎ=ㅀ", "ㅂㅅ=ㅄ", "ㅅㅅ=ㅆ",
  # 원작자 권장 (D v19 .ist)
  "ㄱㅆ=ㄳ", "ㄱㄴ=ㄵ", "ㅇㄴ=ㄶ", "ㄴㅁ=ㄼ", "ㄹㅆ=ㄽ", "ㅇㄹ=ㅀ",
  "ㅅㅂ=ㅄ", "ㄱㄹ=ㄺ", "ㅍㄹ=ㄿ",
  # 역순 편의 (오이)
  "ㅅㄱ=ㄳ", "ㅈㄴ=ㄵ", "ㄴㅇ=ㄶ", "ㅎㄴ=ㄶ", "ㅁㄹ=ㄻ", "ㅁㄴ=ㄼ", "ㅂㄹ=ㄼ",
  "ㅆㄹ=ㄽ", "ㅌㄹ=ㄾ", "ㄹㅇ=ㅀ", "ㅎㄹ=ㅀ",
]
