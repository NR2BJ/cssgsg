# Graphite (Richard Davison, MIT) — https://github.com/rdavison/graphite-layout
#
# 쿼티 물리 자리 순서대로 적은 Graphite 글자. 한 줄이 키보드 한 줄이다.
#   숫자열:   ` 1 2 3 4 5 6 7 8 9 0 - =
#   윗줄:     q w e r t y u i o p [ ] \
#   가운뎃줄: a s d f g h j k l ; '
#   아랫줄:   z x c v b n m , . /
# 영어 모드에서만 쓴다. 한국어·일본어 모드의 기호는 쿼티(키캡) 그대로다.

[meta]
id = "graphite"
name = "Graphite"

[layout]
rows = [
  "`1234567890[]",
  "bldwz'fouj;=\\",
  "nrtsgyhaei,",
  "qxmcvkp.-/",
]
shift_rows = [
  "~!@#$%^&*(){}",
  "BLDWZ_FOUJ:+|",
  "NRTSGYHAEI?",
  "QXMCVKP>\"<",
]
