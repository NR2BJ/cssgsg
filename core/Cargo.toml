[package]
name = "cssgsg-core"
description = "cssgsg 입력 엔진 코어 (플랫폼 독립)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "cssgsg_core"
crate-type = ["rlib", "staticlib"]

[features]
default = ["ffi"]
# 입력기용 C ABI(ffi.rs, core/include/cssgsg.h). 설정 앱용 config-ffi는 이것을 끄고 쓴다:
# 내보낸 C 함수는 링커가 버리지 않아서, 켜 두면 설정 앱에 엔진과 한자 사전(6MB)이 딸려 들어간다.
ffi = []
# Mozc(일본어 한자 변환). 엔진(libcssgsg_mozc.dylib)은 링크하지 않고 실행 중에 읽는다(cssgsg_engine_use_mozc).
# 엔진은 bash tools/mozc/build.sh가 build/mozc-out에 만든다. 끄면(기본) 변환기는 히라가나·가타카나만 내는 EchoConverter다.
# Mozc 시험(tests/mozc.rs)도 이 기능에서만 돈다(엔진이 있어야 한다).
mozc = ["ffi", "mozc-engine"]
# Mozc 변환기(MozcConverter)만. 윈도우 엔진 호스트(win/host)가 쓴다. ffi를 켜지 않으니, 워크스페이스를 같이 빌드해도
# config-ffi에 C ABI가 딸려 들어가지 않고 Mozc 시험이 엔진 없이 돌지 않는다(기능은 같이 빌드하는 패키지끼리 합쳐진다).
mozc-engine = ["dep:serde_json"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
toml = "0.9"
