[package]
name = "cssgsg-core"
description = "cssgsg 입력 엔진 코어 (플랫폼 독립)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "cssgsg_core"
crate-type = ["rlib", "staticlib"]

[features]
# Mozc(일본어 한자 변환)를 링크한다. 먼저 bash tools/mozc/build.sh로 build/mozc-out을 만든다.
# 경로를 바꾸려면 CSSGSG_MOZC_DIR. 끄면(기본) 변환기는 히라가나·가타카나만 내는 EchoConverter다.
mozc = ["dep:serde_json"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
toml = "0.9"
