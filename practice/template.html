<script>
const DATA = /*DATA*/null;
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  const rand = (n) => Math.floor(Math.random() * n);

  // ---------------------------------------------------------------- 키
  // 키 이름은 쿼티 자리 글자(소문자, 기호는 Shift 없는 쪽). 데이터의 키열은 대문자·Shift 기호로 Shift를 적는다.
  const CODE = { Backquote: "`", Minus: "-", Equal: "=", BracketLeft: "[", BracketRight: "]", Backslash: "\\",
    Semicolon: ";", Quote: "'", Comma: ",", Period: ".", Slash: "/", Space: " " };
  for (let i = 0; i < 10; i++) CODE[`Digit${i}`] = String(i);
  for (const c of "abcdefghijklmnopqrstuvwxyz") CODE[`Key${c.toUpperCase()}`] = c;
  const SHIFTED = { "`": "~", 1: "!", 2: "@", 3: "#", 4: "$", 5: "%", 6: "^", 7: "&", 8: "*", 9: "(", 0: ")", "-": "_",
    "=": "+", "[": "{", "]": "}", "\\": "|", ";": ":", "'": '"', ",": "<", ".": ">", "/": "?" };
  const BASE_OF = Object.fromEntries(Object.entries(SHIFTED).map(([b, s]) => [s, b]));
  const toStroke = (c) => (c === " " ? { key: " ", shift: false } : /[A-Z]/.test(c) ? { key: c.toLowerCase(), shift: true }
    : BASE_OF[c] ? { key: BASE_OF[c], shift: true } : { key: c, shift: false });
  const same = (a, b) => a.key === b.key && a.shift === b.shift;
  const capOf = (k) => (k === " " ? "Space" : /[a-z]/.test(k) ? k.toUpperCase() : k);
  const strokeLabel = (s) => (s.shift ? "⇧" : "") + capOf(s.key);
  const LEFT = new Set([..."`12345qwertasdfgzxcvb"]);
  const FINGER = {};
  [["왼손 새끼", "`1qaz"], ["왼손 약지", "2wsx"], ["왼손 중지", "3edc"], ["왼손 검지", "45rtfgvb"], ["오른손 검지", "67yuhjnm"],
    ["오른손 중지", "8ik,"], ["오른손 약지", "9ol."], ["오른손 새끼", "0-=p[]\\;'/"], ["엄지", " "]].forEach(([f, ks]) => { for (const k of ks) FINGER[k] = f; });
  const ROW = {};
  [["숫자열", "`1234567890-="], ["윗열", "qwertyuiop[]\\"], ["홈열", "asdfghjkl;'"], ["아랫열", "zxcvbnm,./"]].forEach(([r, ks]) => { for (const k of ks) ROW[k] = r; });
  const where = (s) => [FINGER[s.key], ROW[s.key], s.shift ? `${LEFT.has(s.key) ? "오른쪽" : "왼쪽"} Shift와 함께` : ""].filter(Boolean).join(" · ");

  // ---------------------------------------------------------------- 기록
  // 설정 앱 안(타자 연습 탭)에서는 앱이 기록 파일(practice.json)에 읽고 쓴다(cssgsgPractice 메시지, 답이 온다).
  // 브라우저로 열면 그 브라우저의 localStorage에 남는다.
  const host = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.cssgsgPractice;
  if (host) document.documentElement.dataset.host = "app";
  const STORE = "cssgsg-practice-v2";
  const saved = { lang: "ko", lesson: {}, mode: {}, done: {}, hint: "pause", board: true, miss: {} };
  async function load() {
    try {
      const text = host ? await host.postMessage({ op: "load" }) : localStorage.getItem(STORE);
      if (text) Object.assign(saved, JSON.parse(text));
    } catch (e) {}
  }
  const save = () => {
    const text = JSON.stringify(saved);
    try {
      if (host) host.postMessage({ op: "save", data: text }).catch(() => {});
      else localStorage.setItem(STORE, text);
    } catch (e) {}
  };

  // ---------------------------------------------------------------- 언어·단계
  const MODE_NAME = { drill: "자리 익히기", words: "낱말 치기", lines: "줄 치기" };
  let lang, L, mode, round = null, allowed = new Set();
  const wayCache = new Map();
  const waysOf = (u) => {
    const k = `${lang.id}|${u}`;
    if (!wayCache.has(k)) {
      const raw = lang.units[u];
      wayCache.set(k, raw ? raw.map(([keys, screens]) => ({ strokes: [...keys].map(toStroke), screens })) : null);
    }
    return wayCache.get(k);
  };
  const SPACE = [{ strokes: [{ key: " ", shift: false }], screens: [" "] }];

  // 글 → 칠 단위. 한국어는 음절(자음 연습 ㅋㅋ 등은 한 덩어리), 영어는 글자, 일본어는 가나(줄임을 익혔으면 じゃ 등은 한 덩어리).
  // 공백은 한국어·영어에서는 스페이스, 일본어에서는 치지 않는 틈.
  function tokenize(text) {
    const out = [];
    for (let i = 0; i < text.length; ) {
      if (text[i] === " ") {
        out.push(lang.space ? { ch: " ", ways: SPACE } : { ch: " ", gap: true });
        i++;
        continue;
      }
      let u = text[i];
      for (const n of [3, 2]) {
        const t = text.slice(i, i + n);
        if (t.length !== n || !lang.units[t]) continue;
        if (lang.id === "ja" ? L.sc : !(t[0] >= "가" && t[0] <= "힣")) { u = t; break; }
      }
      const ways = waysOf(u);
      if (!ways) throw new Error(`칠 수 없는 글자: ${u} (${text})`);
      out.push({ ch: u, ways });
      i += u.length;
    }
    return out;
  }

  // ---------------------------------------------------------------- 자주 틀리는 키(무게)
  const missTable = () => (saved.miss[lang.id] ??= {});
  const missOfStroke = (s) => missTable()[strokeLabel(s)] || 0;
  const weightOf = (text) => {
    let w = 1;
    try {
      for (const t of tokenize(text)) if (t.ways) for (const s of t.ways[0].strokes) w += Math.min(2, missOfStroke(s)) * 0.5;
    } catch (e) {}
    return w;
  };
  function pickFrom(pool, n, freshPool) {
    const out = [];
    const weights = new Map();
    const wOf = (x) => (weights.has(x) ? weights.get(x) : (weights.set(x, weightOf(x)), weights.get(x)));
    for (let i = 0; i < n; i++) {
      const src = freshPool && freshPool.length && Math.random() < 0.65 ? freshPool : pool;
      let total = 0;
      for (const x of src) if (x !== out.at(-1) || src.length === 1) total += wOf(x);
      let r = Math.random() * total, chosen = src[0];
      for (const x of src) {
        if (x === out.at(-1) && src.length > 1) continue;
        r -= wOf(x);
        if (r <= 0) { chosen = x; break; }
      }
      out.push(chosen);
    }
    return out;
  }

  // 익힌 글자 잇기 빈도로 연습 낱말을 만든다(영어·일본어).
  function genWord(g) {
    if (!g.units.length) return "";
    const fresh = new Set(g.fresh);
    const len = g.min + rand(g.max - g.min + 1);
    const out = [];
    let prev = "^";
    for (let i = 0; i < len; i++) {
      const row = lang.bigrams[prev] || {};
      const cands = g.units.filter((u) => !(out.length >= 2 && out.at(-1) === u && out.at(-2) === u));
      let total = 0;
      const ws = cands.map((u) => {
        const w = ((row[u] || 0) + 0.15) * (fresh.has(u) ? 3 : 1);
        total += w;
        return w;
      });
      let r = Math.random() * total, u = cands[0];
      for (let j = 0; j < cands.length; j++) { r -= ws[j]; if (r <= 0) { u = cands[j]; break; } }
      out.push(u);
      prev = u;
    }
    if (fresh.size && !out.some((u) => fresh.has(u)) && Math.random() < 0.7) out[rand(out.length)] = [...fresh][rand(fresh.size)];
    let w = out.join("");
    if (g.caps) w = w[0].toUpperCase() + w.slice(1);
    if (g.punct && g.punct.length && Math.random() < 0.3) w += g.punct[rand(g.punct.length)];
    return w;
  }

  // ---------------------------------------------------------------- 판 만들기
  const WIDTH = { ko: 18, en: 34, ja: 15 };
  const plainOf = (text, strip, lower) => {
    const t = [...text].filter((c) => !strip.includes(c)).join("").replace(/ +/g, " ").trim();
    return lower ? t.toLowerCase() : t;
  };
  const kanaPunct = () => allowed.has("kana:、") && allowed.has("kana:。");

  function drillItems() {
    const d = L.drill;
    const n = lang.id === "ko" ? 24 : 14;
    const picks = d.items ? pickFrom(d.items, n, d.fresh) : [];
    const out = picks.map((p) => (!d.gen || Math.random() < (d.mix ?? 0.5) ? p : genWord(d.gen)));
    while (out.length < n) out.push(genWord(d.gen));
    return out.map((text) => ({ text }));
  }
  function wordItems(n = 12) {
    const all = L.words.map((i) => lang.words[i]);
    const fresh = L.wordsFresh.map((i) => lang.words[i]);
    const toItem = (w) => {
      if (Array.isArray(w)) return { text: w[1], gloss: w[0] !== w[1] ? w[0] : "" };
      return { text: L.capWords ? w[0].toUpperCase() + w.slice(1) : w };
    };
    let items = [];
    if (all.length >= 6) {
      const key = (w) => (Array.isArray(w) ? w[1] : w);
      const byKey = new Map(all.map((w) => [key(w), w]));
      items = pickFrom(all.map(key), n, fresh.map(key)).map((k) => toItem(byKey.get(k)));
    }
    // 낱말이 적으면 연습 글자를 이어 붙인 연습 낱말로 채운다.
    while (items.length < n) {
      const d = L.drill;
      const text = d.gen ? genWord(d.gen) : pickFrom(d.items, 2, d.fresh).join("");
      items.push({ text, made: true });
    }
    return items;
  }
  function lineItems() {
    const pool = [
      ...L.lines.map((i) => lang.lines[i]),
      ...(L.linesPlain || []).map((i) => {
        const l = lang.lines[i];
        return Array.isArray(l) ? [plainOf(l[0], L.strip, false), plainOf(l[1], L.strip, false)] : plainOf(l, L.strip, L.lower);
      }),
    ];
    if (pool.length >= 3) {
      const seen = new Set(), out = [];
      let guard = 0;
      while (out.length < Math.min(4, pool.length) && guard++ < 200) {
        const l = pool[rand(pool.length)];
        const k = Array.isArray(l) ? l[1] : l;
        if (seen.has(k)) continue;
        seen.add(k);
        out.push(Array.isArray(l) ? { text: l[1], gloss: l[0] } : { text: l });
      }
      return out.map((it) => ({ ...it, line: true }));
    }
    // 문장을 칠 수 없는 단계: 낱말을 이어 줄을 만든다.
    const lines = [];
    const stock = wordItems(48);
    for (let i = 0; i < 4; i++) {
      const words = [];
      let len = 0;
      while (len < WIDTH[lang.id] && stock.length) {
        const w = stock.shift();
        words.push(w);
        len += w.text.length + 1;
      }
      if (lang.id === "ja" && kanaPunct()) {
        lines.push({ text: words.map((w) => w.text).join("、") + "。", gloss: words.map((w) => w.gloss || w.text).join("、") + "。", line: true });
      } else {
        lines.push({ text: words.map((w) => w.text).join(" "), gloss: lang.id === "ja" ? words.map((w) => w.gloss || w.text).join("　") : "", line: true });
      }
    }
    return lines;
  }

  // 항목을 줄로 나눈다. 줄의 칠 단위(token)마다 어느 항목인지 적어 둔다(틀린 항목을 다시 내려고).
  function layoutLines(items) {
    if (items.length && items[0].line) {
      return items.map((it, n) => ({ tokens: tokenize(it.text).map((t) => ({ ...t, item: n })), gloss: it.gloss || "", items: [it] }));
    }
    const lines = [];
    let cur = null;
    items.forEach((it, n) => {
      const len = [...it.text].length;
      if (!cur || (cur.len && cur.len + 1 + len > WIDTH[lang.id])) {
        cur = { tokens: [], glosses: [], items: [], len: 0 };
        lines.push(cur);
      } else {
        cur.tokens.push(lang.space ? { ch: " ", ways: SPACE, item: -1 } : { ch: " ", gap: true, item: -1 });
        cur.len += 1;
      }
      cur.tokens.push(...tokenize(it.text).map((t) => ({ ...t, item: n })));
      cur.glosses.push(it.gloss || (lang.id === "ja" ? it.text : ""));
      cur.items.push(it);
      cur.len += len;
    });
    return lines.map((l) => ({ tokens: l.tokens, gloss: lang.id === "ja" && l.glosses.some((g, i) => g !== l.items[i].text) ? l.glosses.join("　") : "", items: l.items }));
  }

  function startRound() {
    const items = mode === "drill" ? drillItems() : mode === "words" ? wordItems() : lineItems();
    round = { items, base: items.length, lines: layoutLines(items), li: 0, ti: 0, typed: [], cand: [], errors: 0, missKeys: {}, missed: new Set(), reviewFrom: -1, finished: false };
    enterToken();
    $("result").hidden = true;
    $("typing").hidden = false;
    render();
  }

  const curLine = () => round.lines[round.li];
  const curToken = () => curLine().tokens[round.ti];
  function enterToken() {
    while (round.li < round.lines.length && curToken() && curToken().gap) round.ti++;
    if (round.li < round.lines.length && round.ti >= curLine().tokens.length) {
      round.li++;
      round.ti = 0;
      return enterToken();
    }
    if (round.li >= round.lines.length) return;
    round.typed = [];
    round.cand = curToken().ways.map((_, i) => i);
    armHint();
  }

  // ---------------------------------------------------------------- 치기
  let hintOn = false, hintTimer = null, badUnit = false;
  function armHint() {
    clearTimeout(hintTimer);
    hintOn = saved.hint === "always";
    badUnit = false;
    if (saved.hint === "pause") hintTimer = setTimeout(() => { hintOn = true; renderHint(); highlight(); }, 1000);
  }
  function expected() {
    const t = curToken();
    return t.ways[round.cand[0]].strokes[round.typed.length];
  }

  function onStroke(s) {
    const t = curToken();
    const n = round.typed.length;
    const next = round.cand.filter((i) => t.ways[i].strokes[n] && same(t.ways[i].strokes[n], s));
    if (!next.length) {
      const want = expected();
      const label = strokeLabel(want);
      round.errors++;
      round.missKeys[label] = (round.missKeys[label] || 0) + 1;
      if (t.item >= 0 && t.item < round.base) round.missed.add(t.item);
      const tbl = missTable();
      tbl[label] = Math.min(10, (tbl[label] || 0) + 1);
      save();
      flash(s.key);
      shake();
      clearTimeout(hintTimer);
      hintOn = true;
      badUnit = true;
      renderLine();
      renderHint();
      highlight();
      return;
    }
    const tbl = missTable();
    if (tbl[strokeLabel(s)]) tbl[strokeLabel(s)] = Math.max(0, tbl[strokeLabel(s)] - 0.25);
    round.typed.push(s);
    round.cand = next;
    const done = next.find((i) => t.ways[i].strokes.length === round.typed.length);
    if (done !== undefined) {
      round.ti++;
      enterToken();
      if (round.li >= round.lines.length) return endOfLines();
    } else if (saved.hint === "pause" && !hintOn) {
      armHint();
    }
    render();
  }

  // 판 끝: 틀린 항목이 있으면(줄 치기 말고) 한 번 더 치고, 그다음 끝낸다.
  function endOfLines() {
    if (mode !== "lines" && round.reviewFrom < 0 && round.missed.size) {
      const items = [...round.missed].sort((a, b) => a - b).map((k) => round.items[k]);
      const unique = [...new Map(items.map((it) => [it.text, it])).values()];
      if (unique.length) {
        const base = round.items.length;
        round.items.push(...unique);
        const extra = layoutLines(unique).map((l) => ({ ...l, tokens: l.tokens.map((t) => ({ ...t, item: t.item >= 0 ? t.item + base : -1 })) }));
        round.reviewFrom = round.lines.length;
        round.lines.push(...extra);
        round.ti = 0;
        enterToken();
        render();
        return;
      }
    }
    finish();
  }

  function finish() {
    clearTimeout(hintTimer);
    round.finished = true;
    const clean = round.errors === 0;
    const key = `${lang.id}:${L.id}:${mode}`;
    if (clean) saved.done[key] = true;
    save();
    const worst = Object.entries(round.missKeys).sort((a, b) => b[1] - a[1]).slice(0, 4);
    $("result-title").textContent = clean ? "오타 없이 끝냈습니다" : "한 판 끝났습니다";
    $("result-note").innerHTML = clean
      ? (nextStep() ? `손이 자리를 잡아 가고 있습니다. 다음은 ${esc(nextStep().label)}입니다. 같은 판을 몇 번 더 오타 없이 쳐도 좋습니다.` : "모든 단계를 오타 없이 끝냈습니다.")
      : `틀린 키: ${worst.map(([k, n]) => `<kbd>${esc(k)}</kbd> ${n}번`).join(", ")}. 이 키가 든 글자가 다음 판에 더 자주 나옵니다. 오타 없이 끝날 때까지 천천히 다시 쳐 보세요.`;
    const ns = nextStep();
    const primary = clean && ns ? ns : { label: "다시 하기", go: () => startRound() };
    const secondary = clean && ns ? { label: "다시 하기", go: () => startRound() } : ns;
    setButton($("primary"), primary, true);
    setButton($("secondary"), secondary, false);
    $("typing").hidden = true;
    $("result").hidden = false;
    renderLessons();
    renderModes();
    highlight(null);
  }
  function setButton(b, act, enter) {
    b.hidden = !act;
    if (!act) return;
    b.textContent = act.label + (enter ? " (Enter)" : "");
    b.onclick = () => { b.blur(); act.go(); };
  }
  function nextStep() {
    const i = L.modes.indexOf(mode);
    if (i + 1 < L.modes.length) {
      const m = L.modes[i + 1];
      return { label: MODE_NAME[m], go: () => setMode(m) };
    }
    const li = lang.lessons.indexOf(L);
    if (li + 1 < lang.lessons.length) {
      const N = lang.lessons[li + 1];
      return { label: `${li + 2}단계 ${N.title}`, go: () => selectLesson(li + 1) };
    }
    return null;
  }

  // ---------------------------------------------------------------- 그리기
  function render() {
    renderLine();
    renderHint();
    highlight();
  }
  function renderLine() {
    if (!round || round.li >= round.lines.length) return;
    const line = curLine();
    const html = line.tokens.map((t, i) => {
      if (t.gap) return `<span class="gap"></span>`;
      if (i < round.ti) return `<span class="done">${esc(t.ch)}</span>`;
      if (i === round.ti) {
        const shown = round.typed.length ? t.ways[round.cand[0]].screens[round.typed.length - 1] : t.ch === " " ? "␣" : t.ch;
        return `<span class="cur${badUnit ? " bad" : ""}">${esc(shown)}</span>`;
      }
      return `<span class="todo">${esc(t.ch)}</span>`;
    }).join("");
    $("line").innerHTML = html;
    $("line").lang = lang.htmlLang;
    $("gloss").textContent = line.gloss;
    $("gloss").hidden = lang.id !== "ja";
    const next = round.lines[round.li + 1];
    $("next-line").textContent = next ? next.tokens.map((t) => (t.gap ? "　" : t.ch)).join("") : "";
    $("next-line").lang = lang.htmlLang;
    $("progress").textContent = `${Math.min(round.li + 1, round.lines.length)} / ${round.lines.length} 줄`;
    $("review").textContent = round.reviewFrom >= 0 && round.li >= round.reviewFrom ? "틀린 것 한 번 더" : "";
  }
  function stepsHtml(way, typedCount, prefix = "") {
    return `<span class="steps">${way.strokes.map((s, i) => {
      const cls = typedCount == null ? "" : i < typedCount ? " done" : i === typedCount ? " next" : "";
      const st = way.screens[i] === " " ? "" : prefix + way.screens[i];
      return `<span class="step${cls}"><kbd>${esc(strokeLabel(s))}</kbd><span class="st" lang="${lang.htmlLang}">${esc(st)}</span></span>`;
    }).join("")}</span>`;
  }
  function renderHint() {
    if (!round || round.finished || round.li >= round.lines.length) return;
    const t = curToken();
    const way = t.ways[round.cand[0]];
    const n = round.typed.length;
    const target = `<span class="target" lang="${lang.htmlLang}">${t.ch === " " ? "␣" : esc(t.ch)}</span>`;
    if (!hintOn) {
      $("hint").innerHTML = target + `<span class="wait">${saved.hint === "miss" ? "틀리면 자리를 보여 줍니다" : "…"}</span>`;
      return;
    }
    const others = t.ways.length > 1 && n === 0
      ? `<span class="alt">다른 입력도 받습니다: ${t.ways.slice(1).map((w) => w.strokes.map(strokeLabel).join(" ")).map(esc).join(" / ")}</span>` : "";
    $("hint").innerHTML = target + stepsHtml(way, n) + `<span class="finger">${esc(where(way.strokes[n]))}</span>` + others;
  }

  // ---------------------------------------------------------------- 배열도
  const P = 60;
  const ROWS = [
    [..."`1234567890-="].map((c) => ["k", 1, c]).concat([["m", 2, "delete"]]),
    [["m", 1.5, "tab"], ...[..."qwertyuiop[]"].map((c) => ["k", 1, c]), ["k", 1.5, "\\"]],
    [["m", 1.75, "caps"], ...[..."asdfghjkl;'"].map((c) => ["k", 1, c]), ["m", 2.25, "return"]],
    [["m", 2.25, "shift", "lshift"], ...[..."zxcvbnm,./"].map((c) => ["k", 1, c]), ["m", 2.75, "shift", "rshift"]],
    [["m", 3.75, "", "blank"], ["k", 6.25, " "], ["m", 5, "", "blank"]],
  ];
  let keyEls = new Map();
  function drawBoard() {
    const parts = [];
    let y = 0;
    const fresh = new Set(L.freshKeys);
    for (const row of ROWS) {
      let x = 0;
      for (const [kind, w, name, tag] of row) {
        const W = w * P, cx = x + W / 2;
        if (tag === "blank") { x += W; continue; }
        const rect = `<rect x="${x + 2}" y="${y + 2}" width="${W - 4}" height="${P - 4}" rx="8"/>`;
        if (kind === "m") {
          const id = tag ?? name;
          parts.push(`<g class="k mod${fresh.has(id) ? " fresh" : ""}" data-k="${id}">${rect}<text class="modlabel" x="${x + 9}" y="${y + P - 11}">${esc(name)}</text></g>`);
          x += W;
          continue;
        }
        if (name === " ") {
          parts.push(`<g class="k${lang.space ? "" : " off"}" data-k=" ">${rect}<text class="modlabel" x="${x + 12}" y="${y + P - 11}">space</text></g>`);
          x += W;
          continue;
        }
        const spec = lang.board[name] || {};
        let on = false;
        const text = (lb, cls, attrs) => {
          if (!lb || !lb.t) return "";
          const ok = lb.id && allowed.has(lb.id);
          if (ok) on = true;
          return `<text class="${cls} c-${lb.c}${ok ? "" : " dim"}" ${attrs}>${esc(lb.t)}</text>`;
        };
        const labels = [
          text(spec.main, "main", `x="${cx}" y="${y + 41}" text-anchor="middle"`),
          text(spec.sub, "sub", `x="${x + W - 8}" y="${y + P - 10}" text-anchor="end"`),
          text(spec.corner, "corner", `x="${x + W - 8}" y="${y + 20}" text-anchor="end"`),
          text(spec.shift, "shift", `x="${x + 9}" y="${y + 19}"`),
          `<text class="cap" x="${x + 8}" y="${y + P - 10}">${esc(capOf(name))}</text>`,
        ].join("");
        parts.push(`<g class="k${on ? "" : " off"}${fresh.has(name) ? " fresh" : ""}" data-k="${esc(name)}">${rect}${labels}</g>`);
        x += W;
      }
      y += P;
    }
    $("board-svg").innerHTML = `<svg viewBox="-2 -2 904 304" role="img" aria-label="${esc(lang.layout)} 배열도(이번 단계)">${parts.join("")}</svg>`;
    keyEls = new Map([...$("board-svg").querySelectorAll(".k")].map((g) => [g.dataset.k, g]));
    const LEGEND = {
      ko: [["var(--cho)", "초성"], ["var(--jung)", "모음"], ["var(--jong)", "받침"]],
      en: [["var(--latin)", "글자"], ["var(--sym)", "기호(왼쪽 위: Shift)"]],
      ja: [["var(--ink)", "한 번"], ["var(--star)", "☆(K) 다음 왼손"], ["var(--black)", "★(D) 다음 오른손"], ["var(--daku)", "゛(L) 뒤치기"]],
    }[lang.id];
    $("legend").innerHTML = [...LEGEND, ["var(--fresh-edge)", "이번 단계에서 새로 익히는 자리"], ["var(--accent)", "다음에 누를 키"]]
      .map(([c, t]) => `<li style="--swatch: ${c}">${esc(t)}</li>`).join("");
  }
  function highlight() {
    keyEls.forEach((g) => g.classList.remove("next"));
    if (!round || round.finished || round.li >= round.lines.length || !hintOn) return;
    const s = expected();
    if (!s) return;
    keyEls.get(s.key)?.classList.add("next");
    if (s.shift) keyEls.get(LEFT.has(s.key) ? "rshift" : "lshift")?.classList.add("next");
  }
  function flash(key) {
    const g = keyEls.get(key);
    if (!g) return;
    g.classList.add("bad");
    setTimeout(() => g.classList.remove("bad"), 280);
  }
  function shake() {
    const t = $("typing");
    t.classList.remove("shake");
    void t.offsetWidth;
    t.classList.add("shake");
  }

  // ---------------------------------------------------------------- 머리·목록
  function renderLangs() {
    $("langs").innerHTML = DATA.langs.map((l) =>
      `<button type="button" role="tab" data-l="${l.id}" aria-selected="${l === lang}"><span lang="${l.htmlLang}">${esc(l.name)}</span><small>${esc(l.layout)}</small></button>`).join("");
    $("langs").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => { b.blur(); selectLang(b.dataset.l); }));
  }
  function dotsOf(X) {
    return `<span class="dots">${X.modes.map((m) => `<i class="${saved.done[`${lang.id}:${X.id}:${m}`] ? "on" : ""}" title="${MODE_NAME[m]}"></i>`).join("")}</span>`;
  }
  function renderLessons() {
    const groups = [];
    lang.lessons.forEach((X, i) => {
      if (!groups.length || groups.at(-1).name !== X.part) groups.push({ name: X.part, items: [] });
      groups.at(-1).items.push([X, i]);
    });
    $("lessons").innerHTML = `<p class="lang-intro">${esc(lang.intro)}</p>` + groups.map((g) => `<div class="lesson-group"><h2>${esc(g.name)}</h2><ol>${g.items.map(([X, i]) =>
      `<li><button type="button" class="lesson-btn" data-i="${i}" aria-current="${X === L}"><span class="num">${i + 1}</span><span class="name">${esc(X.title)}</span>${dotsOf(X)}</button></li>`).join("")}</ol></div>`).join("");
    $("lessons").querySelectorAll(".lesson-btn").forEach((b) => b.addEventListener("click", () => { b.blur(); selectLesson(Number(b.dataset.i)); }));
  }
  function renderModes() {
    $("modes").innerHTML = L.modes.map((m) => `<button type="button" data-m="${m}" aria-pressed="${m === mode}"><i class="${saved.done[`${lang.id}:${L.id}:${m}`] ? "on" : ""}"></i>${MODE_NAME[m]}</button>`).join("");
    $("modes").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => { b.blur(); setMode(b.dataset.m); }));
  }
  function renderHead() {
    const i = lang.lessons.indexOf(L);
    $("title").textContent = `${i + 1}. ${L.title}`;
    $("part").textContent = L.part;
    $("blurb").textContent = L.blurb;
    $("chips").innerHTML = L.chips.map((c) => {
      const keys = c.keys ? [...c.keys].map((k) => `<kbd>${esc(strokeLabel(toStroke(k)))}</kbd>`).join("") : "<kbd>⇧</kbd>+<kbd>글자</kbd>";
      return `<li><span class="t" lang="${lang.htmlLang}">${esc(c.t)}</span>${c.role ? `<span class="role">${esc(c.role)}</span>` : ""}${keys}</li>`;
    }).join("");
    $("exs").innerHTML = L.ex.map((e) => {
      let prefix = "";
      const steps = tokenize(e).map((t) => {
        const h = t.gap ? "" : stepsHtml(t.ways[0], null, prefix);
        prefix += t.ch;
        return h;
      }).join("");
      return `<span class="ex"><span class="ex-out" lang="${lang.htmlLang}">${esc(e)}</span>${steps}</span>`;
    }).join("");
  }

  function selectLang(id) {
    lang = DATA.langs.find((l) => l.id === id) || DATA.langs[0];
    saved.lang = lang.id;
    save();
    renderLangs();
    const i = Math.max(0, lang.lessons.findIndex((X) => X.id === saved.lesson[lang.id]));
    selectLesson(i);
  }
  function selectLesson(i) {
    L = lang.lessons[i];
    allowed = new Set(L.labels);
    saved.lesson[lang.id] = L.id;
    const m = saved.mode[`${lang.id}:${L.id}`];
    mode = L.modes.includes(m) ? m : L.modes[0];
    save();
    renderLessons();
    renderHead();
    renderModes();
    drawBoard();
    startRound();
  }
  function setMode(m) {
    mode = m;
    saved.mode[`${lang.id}:${L.id}`] = m;
    save();
    renderModes();
    startRound();
  }

  function renderHow() {
    const first = {
      pause: "모르는 키는 누르지 말고 1초 기다리면 자리가 보입니다.",
      always: "다음 키를 늘 보여 줍니다. 손에 익으면 1초 멈추면 보기로 바꿔 보세요.",
      miss: "틀렸을 때만 자리를 보여 줍니다.",
    }[saved.hint];
    $("how").textContent = `${first} 틀리면 넘어가지 않고, 틀린 것은 판 끝에 한 번 더 나옵니다. Esc: 이 판 처음부터`;
  }

  // ---------------------------------------------------------------- 키보드
  window.addEventListener("keydown", (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.code === "ShiftLeft" || e.code === "ShiftRight") {
      keyEls.get(e.code === "ShiftLeft" ? "lshift" : "rshift")?.classList.add("held");
      return;
    }
    const name = CODE[e.code];
    if (name !== undefined && document.activeElement && document.activeElement !== document.body) document.activeElement.blur();
    if (!round) return;
    if (round.finished) {
      if (e.key === "Enter") { e.preventDefault(); $("primary").click(); }
      if (name !== undefined) e.preventDefault();
      return;
    }
    if (e.key === "Escape") { e.preventDefault(); startRound(); return; }
    if (name === undefined) return;
    e.preventDefault();
    if (e.repeat) return;
    onStroke({ key: name, shift: e.shiftKey });
  });
  window.addEventListener("keyup", (e) => {
    if (e.code === "ShiftLeft" || e.code === "ShiftRight") keyEls.get(e.code === "ShiftLeft" ? "lshift" : "rshift")?.classList.remove("held");
  });
  window.addEventListener("blur", () => { $("focus-note").hidden = false; });
  window.addEventListener("focus", () => { $("focus-note").hidden = true; });
  $("focus-note").addEventListener("click", () => { $("focus-note").hidden = true; window.focus(); });

  const optHint = $("opt-hint"), optBoard = $("opt-board");
  optHint.addEventListener("change", () => {
    saved.hint = optHint.value;
    save();
    optHint.blur();
    renderHow();
    if (round && !round.finished) { armHint(); render(); }
  });
  optBoard.addEventListener("change", () => {
    saved.board = optBoard.checked;
    save();
    optBoard.blur();
    $("board").hidden = !optBoard.checked;
  });

  if (host) $("record-note").textContent = "기록(끝낸 단계, 자주 틀린 키)은 설정 앱이 practice.json에 남깁니다(정보 탭 → 파일).";
  load().then(() => {
    optHint.value = ["pause", "always", "miss"].includes(saved.hint) ? saved.hint : "pause";
    optBoard.checked = saved.board !== false;
    $("board").hidden = !optBoard.checked;
    renderHow();
    if (!document.hasFocus()) $("focus-note").hidden = false;
    selectLang(saved.lang);
  });
})();
</script>
</body>
</html>
